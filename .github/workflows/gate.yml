# The same gate `check.py` runs locally, on every push and pull request.
#
# **WHY BOTH THIS AND A PRE-COMMIT HOOK.** They fail in opposite directions and that
# is the point rather than duplication. The hook is fast and runs before the mistake
# is recorded -- and it does NOT run until somebody types
# `git config core.hooksPath .githooks`, which a fresh clone silently skips. This
# runs on a machine nobody configured, and reports after the push rather than before.
#
# **A gate that silently does not run is worse than no gate**, which is the failure
# this repository already paid for once: it had no gate at all until 2026-08-19, and
# a British spelling reached `board_state.py` unnoticed.
#
# **NO SECRET IS NEEDED, and that decided the design.** The word table lives in
# `FlickrGroupAddr/backend-api`, which is PUBLIC. The `~/.claude` wrapper would have
# been the obvious source and lives in `claude-config`, which is PRIVATE -- reaching
# it from this public repository would mean a personal access token stored as a
# secret. **A spell-checker is not worth a credential in a public repository.**
name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out localswim
        uses: actions/checkout@v7

      # **The canonical word table, borrowed rather than copied.** A second copy of
      # that list would drift, and the list is the whole tool.
      - name: Check out the word table
        uses: actions/checkout@v7
        with:
          repository: FlickrGroupAddr/backend-api
          path: .word-table-src

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # **All three answer different questions.** Ruff checks that an annotation
      # EXISTS, Pyright checks that it is TRUE, and pytest checks behavior at runtime.
      - name: Install ruff, pyright and pytest
        run: python -m pip install --upgrade ruff pyright pytest

      # **The path is passed explicitly rather than guessed.** `check.py`'s fallback
      # guesses are Terry's machine; CI knows exactly where it put things, and saying
      # so means a checkout change fails loudly instead of quietly falling through to
      # a guess that happens to be wrong.
      - name: Run the gate
        run: >
          python check.py
          --word-table .word-table-src/scripts/claude-dirty-words.py
